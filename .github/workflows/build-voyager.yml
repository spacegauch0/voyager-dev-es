name: Build Voyager Dev-ES firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "keymap/**"
      - ".github/workflows/build-voyager.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compile ZSA Voyager firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout keymap repository
        uses: actions/checkout@v4

      - name: Checkout ZSA QMK firmware
        uses: actions/checkout@v4
        with:
          repository: zsa/qmk_firmware
          ref: firmware25
          path: qmk_firmware
          submodules: recursive

      - name: Install QMK CLI
        run: |
          python3 -m pip install --user qmk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Verify build tools
        run: |
          qmk --version
          arm-none-eabi-gcc --version

      - name: Validate keymap files
        run: |
          test -f keymap/keymap.c
          test -f keymap/config.h
          test -f keymap/rules.mk

          echo "Keymap files:"
          find keymap -maxdepth 1 -type f -print

      - name: Install keymap
        run: |
          KEYMAP_DEST="qmk_firmware/keyboards/zsa/voyager/keymaps/dev_es"

          rm -rf "$KEYMAP_DEST"
          mkdir -p "$KEYMAP_DEST"
          cp -R keymap/. "$KEYMAP_DEST/"

          echo "Installed keymap:"
          find "$KEYMAP_DEST" -maxdepth 1 -type f -print

      - name: Patch missing Voyager keycodes
        run: |
          VOYAGER_HEADER="qmk_firmware/keyboards/zsa/voyager/voyager.h"

          if ! grep -q "TOGGLE_LAYER_COLOR" "$VOYAGER_HEADER"; then
            python3 <<'PY'
          from pathlib import Path

          path = Path("qmk_firmware/keyboards/zsa/voyager/voyager.h")
          source = path.read_text()

          marker = '#include "quantum.h"'

          declarations = '''
          /*
           * Compatibility declarations for standalone firmware25 builds.
           * voyager.c references these keyboard-level keycodes.
           */
          enum voyager_keycodes {
              TOGGLE_LAYER_COLOR = QK_KB,
              LED_LEVEL,
          };
          '''

          if marker not in source:
              raise SystemExit(f"Could not find insertion marker in {path}")

          source = source.replace(
              marker,
              marker + "\n" + declarations,
              1,
          )

          path.write_text(source)
          PY
          fi

          echo "Voyager keycode declarations:"
          grep -n -A5 -B2 "enum voyager_keycodes" "$VOYAGER_HEADER"

      - name: Compile firmware
        working-directory: qmk_firmware
        run: |
          qmk compile \
            -kb zsa/voyager \
            -km dev_es

      - name: Collect firmware
        run: |
          mkdir -p artifact

          find qmk_firmware \
            -maxdepth 1 \
            -type f \
            \( \
              -name "zsa_voyager_dev_es.bin" \
              -o -name "zsa_voyager_dev_es.hex" \
              -o -name "zsa_voyager_dev_es.uf2" \
            \) \
            -exec cp {} artifact/ \;

          echo "Generated firmware files:"
          find artifact -maxdepth 1 -type f -print

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: voyager-dev-es-firmware
          path: artifact/
          if-no-files-found: error
          retention-days: 30