name: Build Voyager Dev-ES firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "keymap/**"
      - ".github/workflows/build-voyager.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout keymap repository
        uses: actions/checkout@v4

      - name: Checkout ZSA QMK
        uses: actions/checkout@v4
        with:
          repository: zsa/qmk_firmware
          ref: firmware25
          path: qmk_firmware
          submodules: recursive

      - name: Install dependencies
        run: |
          python3 -m pip install --user qmk
          qmk setup -y

      - name: Install the keymap
        run: |
          rm -rf qmk_firmware/keyboards/zsa/voyager/keymaps/dev_es
          mkdir -p qmk_firmware/keyboards/zsa/voyager/keymaps
          cp -R userspace/keymap qmk_firmware/keyboards/zsa/voyager/keymaps/dev_es

      - name: Compile firmware
        working-directory: qmk_firmware
        run: qmk compile -kb zsa/voyager -km dev_es

      - name: Collect firmware
        run: |
          mkdir -p artifact
          find qmk_firmware \
            -maxdepth 1 \
            -type f \
            \( -name '*.bin' -o -name '*.hex' -o -name '*.uf2' \) \
            -exec cp {} artifact/ \;

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: voyager-dev-es-firmware
          path: artifact/
          if-no-files-found: error
